# ==========================================================
#  LiveOS SYSTEM registry — базовый конфиг
#  После редактирования выполни `make config-hive`, чтобы
#  пересобрать и установить /reg/SYSTEM.HIV в disk.img.
# ==========================================================

[SYSTEM]
hostname       = "liveos"
timezone       = "UTC"
boot_mode      = "normal"
version        = "0.2"

[SYSTEM/triggers]
on_kernel_crash  = 0x01
on_starter_crash = "/bin/starter"
on_oom           = 0x01
on_fs_corruption = 0x00
on_boot_complete = "/etc/init.sh"
on_shutdown      = "/etc/shutdown.sh"
panic_qr_code    = 0x01

[SYSTEM/resolution]
vga_width = 1024
vga_height = 768
vga_bpp   = 32
font_scale = 1

[SYSTEM/filesystems]
mrules    = "/etc/mrules.conf"

[SYSTEM/boot]
kernel_path    = "/boot/kernel.elf"
initramfs_path = "/boot/initramfs.img"
cmdline        = ""
timeout_sec    = 5
debug_early    = 0x00
safe_mode      = 0x00

[SYSTEM/security]
allow_user_mode = 0x01
kaslr           = 0x00
selinux_mode    = "off"

[SYSTEM/logging]
level          = 3
output         = "serial"
serial_enabled = 1
log_path       = "/var/log/"
max_size_kb    = 1024
rotate_count   = 3
crash_dump_path = "/var/crash/"
kernel_crash_log = "/var/crash/kernel.log"

[SYSTEM/power]
shutdown_timeout_ms = 10000
reboot_on_crash     = 0x00
safe_mode_on_boot   = 0x00

[DRIVERS/nvme]
enabled          = 1
irq_mode         = "intx"
queue_depth      = 32
timeout_ms       = 5000
bounce_buffer_kb = 64

[DRIVERS/ps2]
enabled         = 1
kbd_layout      = "us"
repeat_delay_ms = 500

[DRIVERS/e1000]
enabled = 1
dhcp    = 1

[USER/default]
shell            = "/bin/SH.ELF"
home             = "/"
path             = "/bin:/usr/bin"
lang             = "en_US"
keyboard_layout  = "us"
timezone         = "UTC"
transparent_drag = 1

[USER/desktop]
autostart  = 1
background = 1389350
accent = 42948

[USER/quickopen]
ELF = "@exec"
TXT = "/bin/CAT.ELF"
CFG = "/bin/CAT.ELF"

[USER/context/global]
Properties = "@open"

[USER/context/type/TEXT]
Open = "/bin/CAT.ELF"

[USER/context/type/IMAGE]
Open = "@open"

[USER/context/type/VIDEO]
Open = "@open"

[USER/context/type/AUDIO]
Open = "@open"

[USER/context/type/APPLICATION]
Run = "@open"

[USER/context/ext/PNG]
OpenImage = "@open"

[USER/context/ext/ICO]
OpenIcon = "@open"

[USER/fonts]
default = ""
scale = 1